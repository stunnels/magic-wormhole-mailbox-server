{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wormhole-mailbox.fullname" . }}
  labels:
    {{- include "wormhole-mailbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "wormhole-mailbox.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - ports:
        - port: ws
          protocol: TCP
    {{- end }}
  egress:
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: {{ .Values.database.port }}
          protocol: TCP
    {{- end }}
{{- end }}
