{{- if and (not .Values.postgresql.enabled) (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "magic-wormhole-mailbox-server.fullname" . }}-db
  labels:
    {{- include "magic-wormhole-mailbox-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "database.password or database.existingSecret is required when postgresql.enabled is false" .Values.database.password | quote }}
{{- end }}
