apiVersion: v1
kind: Service
metadata:
  name: {{ include "magic-wormhole-mailbox-server.fullname" . }}
  labels:
    {{- include "magic-wormhole-mailbox-server.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: ws
      port: {{ .Values.service.port }}
      targetPort: ws
      protocol: TCP
      appProtocol: kubernetes.io/ws
  selector:
    {{- include "magic-wormhole-mailbox-server.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "magic-wormhole-mailbox-server.fullname" . }}-headless
  labels:
    {{- include "magic-wormhole-mailbox-server.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: ws
      port: {{ .Values.service.port }}
      targetPort: ws
      protocol: TCP
  selector:
    {{- include "magic-wormhole-mailbox-server.selectorLabels" . | nindent 4 }}
